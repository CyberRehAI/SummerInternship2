# ARZENS Week 06-07 Combined Assignment - Task 6: Ansible Inventory
# File: hosts.ini
# Description: Organized inventory specifying web tier, bastion jump hosts, and global variables

[webservers]
web-prod-01.arzens.internal ansible_host=10.0.1.25 ansible_user=ubuntu environment_tier=prod
web-prod-02.arzens.internal ansible_host=10.0.1.26 ansible_user=ubuntu environment_tier=prod

[security_bastions]
bastion-prod-01.arzens.internal ansible_host=10.0.1.10 ansible_user=ubuntu environment_tier=prod

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
system_timezone=UTC
allowed_ssh_port=22
compliance_output_dir=/var/log/compliance

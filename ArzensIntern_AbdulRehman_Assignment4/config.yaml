# ML Threat Detection Pipeline - Configuration
# UNSW-NB15 Dataset - Network Intrusion Detection

data:
  dataset_name: "UNSW-NB15"
  train_file: "data/UNSW_NB15_training-set.csv"
  test_file: "data/UNSW_NB15_testing-set.csv"
  target_column: "label"
  attack_cat_column: "attack_cat"
  # Columns to drop (identifiers, not features)
  drop_columns: ["id", "attack_cat"]
  test_size: 0.15
  val_size: 0.15
  random_state: 42

preprocessing:
  scaler: "StandardScaler"
  handle_imbalance: "smote"  # options: smote, class_weight, none
  feature_selection:
    method: "mutual_information"
    top_k: 30  # select top K features

models:
  random_forest:
    n_estimators: [100, 200]
    max_depth: [10, 20, null]
    min_samples_split: [2, 5]
    class_weight: ["balanced"]
    random_state: 42

  xgboost:
    n_estimators: [100, 200]
    max_depth: [6, 10]
    learning_rate: [0.01, 0.1]
    subsample: [0.8, 1.0]
    scale_pos_weight: "auto"  # computed from class ratio
    random_state: 42

  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
    max_iter: 1000
    class_weight: ["balanced"]
    solver: "lbfgs"
    random_state: 42

training:
  cv_folds: 5
  scoring: "f1"
  n_jobs: -1

output:
  model_dir: "model_artifacts"
  best_model_file: "best_model.pkl"
  pipeline_file: "preprocessing_pipeline.pkl"
  feature_list_file: "feature_list.txt"
  training_log_file: "training_log.csv"
